name: Hourly tweet

# Schedule intentionally disabled: pulse.yml is the scheduler now.
# GitHub dropped ~92% of scheduled events here (2 fires out of 24 in a
# day), so timing is kept by a long-running job rather than by cron.
# Manual dispatch still works, and pulse calls this script directly.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the next tweet without posting"
        type: boolean
        default: false
      regenerate:
        description: "Discard today's pool and generate a fresh one"
        type: boolean
        default: false

# Writes the tweet pool back to the gh-pages branch.
permissions:
  contents: write

concurrency:
  # Shared with the card workflows: all of them force-push gh-pages, and two
  # concurrent orphan pushes would clobber each other's state.
  group: publish-assets
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint (catch undefined names before spending a run)
        run: python -m pyflakes pipeline/ run_meta.py run_tweets.py run_tiktok.py automate.py

      - name: Post next tweet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ASSETS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_REPO: ${{ github.repository }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: >
          python run_tweets.py
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.regenerate && '--regenerate' || '' }}
