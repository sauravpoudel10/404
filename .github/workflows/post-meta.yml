name: Post to Instagram + Facebook

# Schedule intentionally disabled: pulse.yml is the scheduler now.
# GitHub dropped ~92% of scheduled events here (2 fires out of 24 in a
# day), so timing is kept by a long-running job rather than by cron.
# Manual dispatch still works, and pulse calls this script directly.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and host the card but don't post"
        type: boolean
        default: false
      mode:
        description: "Instagram format (auto alternates by slot)"
        type: choice
        options: [auto, reel, post]
        default: auto

# Needed to force-push the gh-pages branch that hosts the card images.
permissions:
  contents: write

concurrency:
  # Two runs pushing an orphan gh-pages commit at once would clobber each
  # other's manifest, so slots queue instead of overlapping.
  group: publish-assets
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint (catch undefined names before spending a run)
        run: python -m pyflakes pipeline/ run_meta.py run_tweets.py run_tiktok.py automate.py

      - name: Generate and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ASSETS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_REPO: ${{ github.repository }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python run_meta.py ${{ inputs.dry_run && '--dry-run' || '' }} --mode ${{ inputs.mode || 'auto' }}
